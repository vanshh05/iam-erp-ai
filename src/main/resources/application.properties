# =============================================
# IAM ERP AI - Application Configuration
# =============================================

# --- Server ---
server.port=8080

# --- Supabase PostgreSQL Connection ---
spring.datasource.url=jdbc:postgresql://db.xfdtajlaoyljysydbugp.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=YOUR_SUPABASE_DB_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --- JPA Settings ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# --- Gemini API ---
gemini.api.key=YOUR_GEMINI_API_KEY
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# --- Sync Job (DISABLED until GCP is ready) ---
sync.enabled=false
sync.cron=0 */2 * * * *

# --- GCP ERP Database (DISABLED until ready) ---
# Uncomment and fill these when connecting GCP:
# erp.datasource.url=jdbc:postgresql://YOUR_GCP_HOST:5432/YOUR_DB_NAME
# erp.datasource.username=YOUR_GCP_DB_USERNAME
# erp.datasource.password=YOUR_GCP_DB_PASSWORD

# --- CORS ---
cors.allowed.origins=http://localhost:3000,https://iamerp.com,https://ai.iamerp.com

# --- Logging ---
logging.level.com.iamerp=INFO
logging.level.org.springframework.web=WARN
