# =============================================
# IAM ERP AI - Application Configuration
# =============================================

server.port=8080

# --- Supabase PostgreSQL Connection ---
# Full JDBC URL including credentials set via environment variable
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=postgres.xfdtajlaoyljysydbugp
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# --- Gemini API ---
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# --- Sync Job (disabled until GCP ready) ---
sync.enabled=false
sync.cron=0 */2 * * * *

# --- CORS ---
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Logging ---
logging.level.com.iamerp=INFO
logging.level.org.springframework.web=WARN