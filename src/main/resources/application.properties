server.port=8080

# --- GCP MySQL Connection ---
spring.datasource.url=jdbc:mysql://34.131.240.142:3306/Ai_Ayaam?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=MLAY3kwifq9+9mGH
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
# max-lifetime kept SHORTER than MySQL wait_timeout so Hikari retires connections
# before MySQL kills them. 4 min is safe even if MySQL wait_timeout is low.
spring.datasource.hikari.max-lifetime=240000
# Validate a connection is alive before handing it to a query (self-heals dead connections)
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
# Keep idle connections warm so they don't get silently dropped by the DB
spring.datasource.hikari.keepalive-time=120000

# --- JPA ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# --- Gemini API ---
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# --- Sync Job (disabled until ready) ---
sync.enabled=false
sync.cron=0 */2 * * * *

# --- CORS ---
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Logging ---
logging.level.com.iamerp=INFO
logging.level.org.springframework.web=WARN
# ── JWT Authentication ──
# Secret MUST be at least 32 chars (256 bits) for HS256. Set JWT_SECRET in Render env vars.
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-min-32-chars-please}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# ── Brevo email (password reset) ──
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:Ayaam ERP}